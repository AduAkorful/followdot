name = "followdot-autocopy"
main = "src/index.ts"
compatibility_date = "2026-08-27"

# Secrets — set via:
#   wrangler secret put API_TOKEN
# Referenced as env.API_TOKEN in src/index.ts. If unset, authenticated routes
# fail closed with HTTP 503 until the secret is configured.

# Required runtime endpoints are configured as vars or secrets:
#   DREAMDEX_REST_URL and DREAMDEX_WS_URL

[triggers]
crons = ["*/1 * * * *"]  # every minute

[[kv_namespaces]]
binding = "WHALE_KV"
id = "followdot-whales"
preview_id = "followdot-whales-preview"

[[kv_namespaces]]
binding = "SESSION_KEYS_KV"
id = "followdot-session-keys"
preview_id = "followdot-session-keys-preview"
